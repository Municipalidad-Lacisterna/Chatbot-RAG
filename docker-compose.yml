name: cisternin

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cisternin-bot:latest
    container_name: cisternin-app
    env_file: .env
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
    volumes:
      - cisternin_chroma:/app/chroma_db
      - cisternin_data_persist:/app/data_persist
      - cisternin_data:/app/data
      - cisternin_hf_cache:/app/.hf_cache
    restart: unless-stopped
    depends_on:
      ollama-init:
        condition: service_completed_successfully
        required: false
    networks:
      - cisternin-net

  # Motor LLM Local (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: cisternin-ollama
    profiles: ["gpu", "cpu"]
    volumes:
      - cisternin_ollama_models:/root/.ollama
    restart: unless-stopped
    networks:
      - cisternin-net

  # Inicializador que descarga el modelo
  ollama-init:
    image: curlimages/curl:latest
    container_name: cisternin-ollama-init
    profiles: ["gpu", "cpu"]
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./docker/ollama-init.sh:/ollama-init.sh
    entrypoint: ["/bin/sh", "/ollama-init.sh"]
    depends_on:
      - ollama
    networks:
      - cisternin-net

  # Proxy HTTPS Caddy
  caddy:
    image: caddy:2-alpine
    container_name: cisternin-caddy
    profiles: ["web"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
      - cisternin_caddy_data:/data
      - cisternin_caddy_config:/config
    depends_on:
      - app
    networks:
      - cisternin-net

  # Cron para mantenimientos
  cron:
    image: cisternin-bot:latest
    container_name: cisternin-cron
    profiles: ["cron"]
    entrypoint: ["/bin/bash", "/app/scripts/docker_cron.sh"]
    env_file: .env
    environment:
      PROJECT_DIR: /app
      PYTHON: python
    volumes:
      - cisternin_chroma:/app/chroma_db
      - cisternin_data_persist:/app/data_persist
      - cisternin_data:/app/data
      - cisternin_hf_cache:/app/.hf_cache
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    networks:
      - cisternin-net

volumes:
  cisternin_chroma:
  cisternin_data_persist:
  cisternin_data:
  cisternin_hf_cache:
  cisternin_ollama_models:
  cisternin_caddy_data:
  cisternin_caddy_config:

networks:
  cisternin-net:
